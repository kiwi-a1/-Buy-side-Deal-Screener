# How scoring adapts to each company. Every number here has a written reason and is shown in the report next to
# the score it changed. These are judgement-based starting points (no historical outcome data to calibrate against):
# edit them to match your fund's view. The app checks this file when it starts a screening and refuses invalid values.

# Funding stages (same names the AI uses) grouped by what investors can reasonably expect to see.
stage_groups:
  early: [pre-seed, seed, seed-extension, late-seed]
  venture: [series-a, series-b]
  growth: [series-c, series-d, growth, pre-ipo, public]

# What "good" looks like at each stage - given to the AI so scores are relative to stage, not absolute.
stage_expectations:
  early: "Pre-seed/seed: little or no revenue is normal. Judge team, problem, insight and early signals (pilots, waitlists, first customers). Do not punish missing revenue."
  venture: "Series A/B: expect product-market fit evidence - recurring revenue (often EUR 1-10M ARR), strong growth, retention data and a repeatable sales or acquisition channel."
  growth: "Growth/late stage: expect substantial revenue, unit economics, margins, market leadership signals and a defensible position. Founder story matters less than the numbers."

# Multiplier on your thesis weight for each dimension, per stage group. 1.0 = unchanged.
stage_multipliers:
  early:
    founder_market_fit: {x: 1.4, why: "Early on there is little data; the team is the main thing an investor can assess."}
    problem: {x: 1.2, why: "A sharp, urgent problem is the strongest early predictor when the product is young."}
    timing: {x: 1.2, why: "Why-now matters most before the market has proven itself."}
    traction: {x: 0.6, why: "Little traction is expected this early, so it should not dominate the score."}
    business_model: {x: 0.7, why: "Pricing and margins are usually not settled at pre-seed/seed."}
  venture:
    traction: {x: 1.3, why: "Series A/B is priced on traction; it must carry more weight."}
    distribution: {x: 1.3, why: "A repeatable acquisition channel is the key Series A/B question."}
    business_model: {x: 1.2, why: "Unit economics start to be visible and matter."}
    product_love: {x: 1.2, why: "Retention is the main product-market-fit signal at this stage."}
  growth:
    traction: {x: 1.4, why: "Late-stage value is driven by revenue scale and growth."}
    business_model: {x: 1.5, why: "Margins and unit economics decide late-stage returns."}
    moat_path: {x: 1.3, why: "Defensibility protects a late-stage valuation."}
    founder_market_fit: {x: 0.8, why: "By growth stage the numbers say more than the founding story."}
    timing: {x: 0.8, why: "Timing has largely played out by this stage."}

# Business model types the AI must choose from, with multipliers. "other" means no adjustment.
model_types:
  b2b_saas:
    label: "B2B software / SaaS"
    multipliers:
      distribution: {x: 1.2, why: "Sales efficiency (CAC, payback) decides SaaS outcomes."}
      business_model: {x: 1.2, why: "Recurring revenue, margins and net retention are the SaaS value drivers."}
  marketplace:
    label: "Marketplace / platform"
    multipliers:
      distribution: {x: 1.3, why: "A marketplace lives or dies on acquiring both sides cheaply."}
      moat_path: {x: 1.3, why: "Network effects and liquidity are the marketplace moat."}
  consumer:
    label: "Consumer app / D2C / e-commerce"
    multipliers:
      product_love: {x: 1.4, why: "Consumer businesses depend on retention and organic pull."}
      distribution: {x: 1.3, why: "Paid acquisition cost can make or break consumer unit economics."}
  fintech:
    label: "Fintech / financial services"
    multipliers:
      moat_path: {x: 1.2, why: "Licences, compliance and partner banks are real barriers to entry."}
      business_model: {x: 1.2, why: "Take rates, credit or fraud losses drive fintech economics."}
      founder_market_fit: {x: 1.1, why: "Regulated finance rewards domain and regulatory expertise."}
  health_bio:
    label: "Healthcare / biotech / medtech"
    multipliers:
      founder_market_fit: {x: 1.3, why: "Clinical or scientific expertise is essential."}
      moat_path: {x: 1.3, why: "IP and regulatory approval create durable protection."}
      traction: {x: 0.8, why: "Clinical and hospital sales cycles are long, so early traction is naturally thin."}
  deeptech_hardware:
    label: "Deep tech / hardware"
    multipliers:
      founder_market_fit: {x: 1.3, why: "Technical depth of the team is the main early asset."}
      moat_path: {x: 1.4, why: "IP and technical difficulty are the core defence."}
      traction: {x: 0.7, why: "R&D-heavy companies show revenue later."}
  services:
    label: "Services / agency-like"
    multipliers:
      business_model: {x: 1.3, why: "Margins and scalability are the main doubt for service-heavy models."}
      moat_path: {x: 1.2, why: "Services are easy to copy; defensibility needs extra scrutiny."}
  other:
    label: "Other / unclear"
    multipliers: {}

# Verification affects the score. Contradicted claims lower the dimensions that relied on them.
verification:
  contradicted_penalty: 2      # points off each related dimension, per contradicted high/medium-importance claim
  penalty_cap: 4               # never more than this many points off one dimension
  block_advance_on_contradiction: true   # an ADVANCE becomes MAYBE until contradicted claims are resolved
  category_dimensions:          # which dimensions rely on which kind of claim
    traction: [traction]
    revenue: [traction, business_model]
    customers: [traction, product_love]
    team: [founder_market_fit]
    funding: []
    market: [market]
    product: [wedge, product_love]
    partnerships: [distribution]
    company: []
    other: []

# Confidence in the result (shown next to the score; does not change it).
confidence:
  high_min_coverage: 8         # dimensions with evidence
  high_min_verified_share: 0.4 # share of checked claims verified by an independent source
  low_max_coverage: 4
  low_min_supported_share: 0.15  # below this share of key claims supported by any source, confidence is Low

# Uniformly mediocre deals are capped; a strong market with strong traction or distribution gets a small boost.
outlier:
  cap_if_all_below: 7
  cap_at: 6.0
  boost_if_market_at_least: 8
  boost_if_traction_or_distribution_at_least: 7
  boost: 0.5

# Typical round sizes (EUR) per stage, used only to flag implausible asks. Approximate European/US ranges.
round_size_eur:
  pre-seed: [100000, 2500000]
  seed: [500000, 8000000]
  seed-extension: [300000, 8000000]
  late-seed: [1000000, 10000000]
  series-a: [3000000, 30000000]
  series-b: [10000000, 80000000]
  series-c: [25000000, 200000000]
  series-d: [50000000, 600000000]
  growth: [50000000, 1500000000]
  pre-ipo: [100000000, 3000000000]
