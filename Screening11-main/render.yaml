# Render Blueprint for this repo (project lives in Screening11-main/).
services:
  - type: web
    name: deal-screening
    runtime: docker
    rootDir: Screening11-main
    plan: starter            # a persistent disk needs a paid plan; free plans lose the database on every restart
    autoDeployTrigger: commit
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: APP_PASSWORD
        sync: false          # optional login; leave it empty in the dashboard for no password
      - key: GROQ_API_KEY
        sync: false          # optional: or add keys later on the app's AI keys page
